<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dieyez — Connect</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f7c948, #e0a800);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #0a0a0a;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .bio {
      font-size: 14px;
      color: #a0a0a0;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #f5f5f5;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .links a:hover {
      background: #252525;
      border-color: #f7c948;
      transform: translateY(-2px);
    }

    .links a .emoji {
      font-size: 20px;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">D</div>
    <h1>DIEYEZ</h1>
    <p class="bio">
      ‣ Explorer l'art, ressentir le design, révéler la culture.<br>
      ‣ Consultant Créatif
    </p>
    <div class="links">
      <a href="https://www.youtube.com/@dieyez" target="_blank">
        <span class="emoji">🎬</span> YouTube
      </a>
      <a href="https://www.youtube.com/@dieyez" target="_blank">
        <span class="emoji">🔴</span> Dernière vidéo
      </a>
      <a href="https://www.instagram.com/dieyez_/" target="_blank">
        <span class="emoji">📸</span> Instagram
      </a>
      <a href="https://www.dailymotion.com/user/dieyez" target="_blank">
        <span class="emoji">🎥</span> Dailymotion
      </a>
      <a href="https://dieyez.fr" target="_blank">
        <span class="emoji">🌐</span> Site web
      </a>
      <a href="mailto:iam@dieyez.fr">
        <span class="emoji">✉️</span> iam@dieyez.fr
      </a>
    </div>
    <p class="footer">© 2026 Dieyez</p>
  </div>
</body>
</html>
