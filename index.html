<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIEYEZ — Focus · Bientôt disponible</title>
  <meta name="description" content="Production vidéo B2B. Un peu plus sur vous disponible dès maintenant.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=League+Spartan:wght@300;400&family=Orbitron:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #0f0f0f;
      --ink: #EDE7DA;
      --ink-60: rgba(237,231,218,.6);
      --ink-40: rgba(237,231,218,.4);
      --line: rgba(237,231,218,.12);
      --terra: #C94F2D;
      --title: "Orbitron", "Arial Narrow", sans-serif;
      --accent: "League Spartan", system-ui, sans-serif;
      --sans: "Geist", system-ui, sans-serif;
      --ease-out: cubic-bezier(.16,1,.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--ink); color: var(--cream); }

    /* HEADER */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 20px clamp(20px, 3vw, 48px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      font-family: var(--title);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .header-tag {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ink-40);
    }

    /* MAIN */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(80px, 12vw, 140px) clamp(24px, 6vw, 80px);
      max-width: 700px;
      width: 100%;
    }

    .label {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--terra);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp .7s var(--ease-out) .1s forwards;
    }

    h1 {
      font-family: var(--title);
      font-weight: 700;
      font-size: clamp(36px, 8vw, 96px);
      line-height: .95;
      letter-spacing: -.01em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp .8s var(--ease-out) .2s forwards;
    }

    h1 span { color: var(--terra); }

    .sub {
      font-family: var(--accent);
      font-weight: 300;
      font-size: clamp(16px, 2.5vw, 22px);
      line-height: 1.4;
      color: var(--ink-60);
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp .8s var(--ease-out) .35s forwards;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 16px 36px;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: background .3s, color .3s;
      opacity: 0;
      animation: fadeUp .8s var(--ease-out) .5s forwards;
    }
    .cta-btn::after { content: "↗"; font-size: 14px; }
    .cta-btn:hover { background: var(--ink); color: var(--cream); }

    .footer-line {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 32px;
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-40);
      opacity: 0;
      animation: fadeUp .6s var(--ease-out) .8s forwards;
    }
    .footer-line a { color: var(--ink-60); transition: color .2s; }
    .footer-line a:hover { color: var(--ink); }

    /* BG GRID */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 100%);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* MODAL */
    .modal {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(10,10,10,.85);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .modal.open { opacity: 1; pointer-events: all; }
    .modal__inner {
      background: #111;
      border: 1px solid var(--line);
      width: 100%; max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 40px;
      transform: translateY(20px);
      transition: transform .35s var(--ease-out);
    }
    .modal.open .modal__inner { transform: translateY(0); }
    .modal__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .modal__title {
      font-family: var(--title);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .modal__close {
      background: none; border: none; cursor: pointer;
      color: var(--ink-60); padding: 4px;
      transition: color .2s;
    }
    .modal__close:hover { color: var(--ink); }

    .form-field { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-60);
      margin-bottom: 8px;
    }
    .form-input, .form-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(237,231,218,.2);
      padding: 10px 0;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
      resize: vertical;
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--ink-40); }
    .form-input:focus, .form-textarea:focus { border-bottom-color: var(--terra); }
    .form-actions { margin-top: 28px; }
    .submit-btn {
      width: 100%;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 16px;
      background: var(--ink);
      color: var(--cream);
      border: none;
      cursor: pointer;
      transition: background .2s;
    }
    .submit-btn:hover { background: var(--terra); color: var(--ink); }
    .form-error { font-size: 12px; color: var(--terra); margin-top: 10px; }
    .modal__confirmation { text-align: center; padding: 20px 0; }
    .modal__confirmation p:first-child {
      font-family: var(--title);
      font-size: 18px;
      margin-bottom: 8px;
    }
    .modal__confirmation p:last-child { color: var(--ink-60); font-size: 14px; }
  </style>
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>

  <header class="site-header">
    <a href="https://dieyez.fr" class="wordmark">DIEYEZ</a>
    <span class="header-tag">Focus · Bientôt</span>
  </header>

  <main>
    <p class="label">Mes services · Coming soon</p>
    <h1>Focus<span>.</span></h1>
    <p class="sub">Production vidéo B2B.<br>La page arrive bientôt.</p>
    <button class="cta-btn" id="open-modal">Contacter maintenant</button>
  </main>

  <div class="footer-line">
    <span>DIEYEZ · Paris</span>
    <a href="mailto:iam@dieyez.fr">iam@dieyez.fr</a>
    <span>B2B · Vidéo</span>
  </div>

  <!-- MODAL CONTACT -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Formulaire de contact">
    <div class="modal__inner">
      <div class="modal__header">
        <h2 class="modal__title">Un peu plus sur vous</h2>
        <button class="modal__close" id="close-modal" aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="3" y1="3" x2="15" y2="15"/>
            <line x1="15" y1="3" x2="3" y2="15"/>
          </svg>
        </button>
      </div>

      <form id="lead-form" novalidate>
        <input type="hidden" name="access_key" value="5c317844-e843-4efe-9876-aa31eb176a2a">
        <input type="hidden" name="subject" value="Nouveau contact via focus.dieyez.fr">
        <input type="checkbox" name="botcheck" style="display:none">
        <div class="form-field">
          <label class="form-label" for="activite">Votre activité *</label>
          <input type="text" id="activite" name="activite" class="form-input" placeholder="En une phrase + lien site ou Instagram" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="offre">Votre offre principale *</label>
          <textarea id="offre" name="offre" class="form-textarea" rows="3" placeholder="Ce que vous vendez vraiment" required></textarea>
        </div>
        <div class="form-field">
          <label class="form-label" for="blocage">Ce qui vous bloque</label>
          <textarea id="blocage" name="blocage" class="form-textarea" rows="3" placeholder="Votre ressenti sur ce qui bloque : vidéo, message, clarté..."></textarea>
        </div>
        <div class="form-field">
          <label class="form-label" for="objectif">Objectif dans 30 jours</label>
          <input type="text" id="objectif" name="objectif" class="form-input" placeholder="Un résultat concret, mesurable">
        </div>
        <div class="form-field">
          <label class="form-label" for="email">Email *</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="votre@email.com" required>
        </div>
        <input type="text" name="_hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
        <div class="form-actions">
          <button type="submit" class="submit-btn" id="form-submit">Envoyer</button>
          <p class="form-error" id="form-error" hidden></p>
        </div>
      </form>

      <div class="modal__confirmation" id="modal-confirmation" hidden>
        <p>Bien reçu.</p>
        <p>Réponse écrite sous 48 à 72h.</p>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const openBtn = document.getElementById('open-modal');
    const closeBtn = document.getElementById('close-modal');

    openBtn.addEventListener('click', () => modal.classList.add('open'));
    closeBtn.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

    document.getElementById('lead-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById('form-submit');
      const errEl = document.getElementById('form-error');

      if (form._hp && form._hp.value) return;

      const required = form.querySelectorAll('[required]');
      for (const f of required) {
        if (!f.value.trim()) {
          errEl.textContent = 'Merci de remplir les champs obligatoires.';
          errEl.hidden = false;
          f.focus();
          return;
        }
      }
      errEl.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Envoi…';

      const data = new FormData(form);
      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: data,
          headers: { Accept: 'application/json' }
        });
        if (res.ok) {
          form.hidden = true;
          document.getElementById('modal-confirmation').hidden = false;
        } else {
          throw new Error();
        }
      } catch {
        errEl.textContent = 'Erreur d\'envoi. Écrivez directement à iam@dieyez.fr';
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Envoyer';
      }
    });
  </script>
</body>
</html>
